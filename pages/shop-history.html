<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Raj Gautam">
  <title>Shop History - Ration Seva</title>
  <link rel="icon" href="../images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body>
  <div class="tricolor-top"></div>
  <div id="navbar"></div>

  <main class="container">
    <div class="breadcrumb"><a href="shopkeeper-dashboard.html">Dashboard</a><span>&rsaquo;</span><span>History</span></div>
    <div class="page-header">
      <h1>Distribution History</h1>
      <p>All distributions from your shop.</p>
    </div>

    <div id="alert"></div>
    <div id="container"><div class="empty-state"><div class="spinner"></div><p style="margin-top:14px">Loading...</p></div></div>
  </main>

  <div id="footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const user = requireAuth(['shopkeeper']);
    if (user) load();

    async function load() {
      try {
        const list = await apiCall(`/shopkeeper/distributions/${user.id}`);
        if (!list.length) {
          document.getElementById('container').innerHTML = `
            <div class="empty-state"><div class="icon">&#128237;</div><p>No distributions yet</p></div>
          `;
          return;
        }

        document.getElementById('container').innerHTML = `
          <div class="card">
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>Card</th><th>Month</th><th>Items</th><th>Amount</th><th>Fraud</th><th>Date</th></tr></thead>
                <tbody>
                  ${list.map((d) => `
                    <tr>
                      <td class="mono"><strong>${escapeHtml(d.cardNumber)}</strong></td>
                      <td>${escapeHtml(d.month)}</td>
                      <td>${escapeHtml(itemSummary(d.items))}</td>
                      <td>${formatINR(d.totalAmount)}</td>
                      <td>${d.fraudFlag
                        ? '<span class="badge badge-danger">Flagged</span>'
                        : '<span class="badge badge-success">Clear</span>'}</td>
                      <td>${formatDate(d.distributedAt)}</td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        showAlert('alert', err.message, 'danger');
        document.getElementById('container').innerHTML = '';
      }
    }
  </script>
</body>
</html>
