<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Raj Gautam">
  <title>Dashboard - Ration Seva</title>
  <link rel="icon" href="../images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body>
  <div class="tricolor-top"></div>
  <div id="navbar"></div>
  <main>
    <div class="container">
      <div class="empty-state">
        <div class="spinner"></div>
        <p style="margin-top:16px">Redirecting to your dashboard...</p>
      </div>
    </div>
  </main>
  <div id="footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const user = getCurrentUser();
    if (!user || !getToken()) {
      window.location.href = 'login.html';
    } else {
      const routes = {
        beneficiary: 'beneficiary-dashboard.html',
        shopkeeper: 'shopkeeper-dashboard.html',
        admin: 'admin-dashboard.html'
      };
      window.location.href = routes[user.role] || 'login.html';
    }
  </script>
</body>
</html>
