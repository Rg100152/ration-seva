<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Raj Gautam">
  <title>Distribution History - Ration Seva</title>
  <link rel="icon" href="../images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body>
  <div class="tricolor-top"></div>
  <div id="navbar"></div>

  <main class="container">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a><span>&rsaquo;</span><span>History</span></div>
    <div class="page-header">
      <h1>Distribution History</h1>
      <p>All your past ration collections.</p>
    </div>

    <div id="alert"></div>
    <div id="historyContainer"><div class="empty-state"><div class="spinner"></div><p style="margin-top:14px">Loading...</p></div></div>
  </main>

  <div id="footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    const user = requireAuth(['beneficiary']);
    if (user) load();

    async function load() {
      try {
        const card = await apiCall(`/beneficiary/my-card/${user.id}`);
        const history = await apiCall(`/beneficiary/history/${card.cardNumber}`);

        if (!history.length) {
          document.getElementById('historyContainer').innerHTML = `
            <div class="empty-state"><div class="icon">&#128237;</div><p>No distribution history yet</p></div>
          `;
          return;
        }

        document.getElementById('historyContainer').innerHTML = `
          <div class="card">
            <div class="table-wrap">
              <table class="table">
                <thead><tr><th>Month</th><th>Items</th><th>Amount</th><th>Status</th><th>Date</th></tr></thead>
                <tbody>
                  ${history.map((h) => `
                    <tr>
                      <td><strong>${escapeHtml(h.month)}</strong></td>
                      <td>${escapeHtml(itemSummary(h.items))}</td>
                      <td>${formatINR(h.totalAmount)}</td>
                      <td><span class="badge badge-success">${escapeHtml(h.status)}</span></td>
                      <td>${formatDate(h.distributedAt)}</td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) {
        showAlert('alert', err.message, 'danger');
        document.getElementById('historyContainer').innerHTML = '';
      }
    }
  </script>
</body>
</html>
