<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Raj Gautam">
  <title>Server Error - Ration Seva</title>
  <link rel="icon" href="../images/favicon.ico">

<body>
  <div class="tricolor-top"></div>
  <div id="navbar"></div>

  <main class="container">
    <div class="empty-state" style="padding-top:70px">
      <div style="font-size:80px;font-weight:800;color:var(--danger);letter-spacing:-3px">500</div>
      <div class="icon" style="margin-top:10px">&#9888;&#65039;</div>
      <p style="font-size:18px;font-weight:700;color:var(--text)">Something went wrong</p>

      <div class="flex flex-wrap gap-12" style="justify-content:center;margin-top:22px">
        <button onclick="window.location.reload()" class="btn btn-primary">Retry</button>
        <a href="../index.html" class="btn btn-outline">Go Home</a>
      </div>
    </div>
  </main>

  <div id="footer"></div>
  <script src="../js/config.js"></script>
