<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Raj Gautam">
  <title>Reports - Ration Seva</title>
  <link rel="icon" href="../images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body>
  <div class="tricolor-top"></div>
  <div id="navbar"></div>

  <main class="container">
    <div class="breadcrumb"><a href="admin-dashboard.html">Dashboard</a><span>&rsaquo;</span><span>Reports</span></div>
    <div class="page-header">
      <h1>Analytics &amp; Reports</h1>
      <p>Distribution trends and category breakdown.</p>
    </div>

    <div id="alert"></div>
    <div class="stats-grid" id="statsGrid"></div>

    <div class="card">
      <h3 class="card-title">Distribution by Month</h3>
      <div id="monthTable"><div class="spinner"></div></div>
    </div>

    <div class="card">
      <h3 class="card-title">Cards by Category</h3>
      <div id="categoryTable"><div class="spinner"></div></div>
    </div>

    <div class="card">
      <h3 class="card-title">Fraud-flagged Transactions</h3>
      <div id="fraudTable"><div class="spinner"></div></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    requireAuth(['admin']);

    async function load() {
      try {
        const [stats, reports, fraud] = await Promise.all([
          apiCall('/admin/stats'),
          apiCall('/admin/reports'),
          apiCall('/admin/fraud')
        ]);

        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card"><div class="stat-icon">&#128101;</div><h3>${stats.totalUsers}</h3><p>Beneficiaries</p></div>
          <div class="stat-card"><div class="stat-icon">&#127978;</div><h3>${stats.totalShops}</h3><p>Shops</p></div>
          <div class="stat-card"><div class="stat-icon">&#129697;</div><h3>${stats.totalCards}</h3><p>Active Cards</p></div>
          <div class="stat-card"><div class="stat-icon">&#9888;&#65039;</div><h3>${stats.fraudCount || 0}</h3><p>Fraud Flags</p></div>
        `;

        const months = reports.byMonth || [];
        document.getElementById('monthTable').innerHTML = months.length
          ? `<div class="table-wrap"><table class="table">
               <thead><tr><th>Month</th><th>Distributions</th><th>Units</th><th>Total Value</th></tr></thead>
               <tbody>${months.map((m) => `
                 <tr>
                   <td><strong>${escapeHtml(m._id)}</strong></td>
                   <td>${m.distributions}</td>
                   <td>${m.units}</td>
                   <td>${formatINR(m.amount)}</td>
                 </tr>`).join('')}</tbody>
             </table></div>`
          : '<div class="empty-state"><div class="icon">&#128202;</div><p>No distribution data yet</p></div>';

        const cats = reports.byCategory || [];
        document.getElementById('categoryTable').innerHTML = cats.length
          ? `<div class="table-wrap"><table class="table">
               <thead><tr><th>Category</th><th>Cards</th></tr></thead>
               <tbody>${cats.map((c) => `
                 <tr><td><span class="badge badge-info">${escapeHtml(c._id)}</span></td><td>${c.count}</td></tr>
               `).join('')}</tbody>
             </table></div>`
          : '<div class="empty-state"><p>No card data</p></div>';

        document.getElementById('fraudTable').innerHTML = fraud.length
          ? `<div class="table-wrap"><table class="table">
               <thead><tr><th>Card</th><th>Month</th><th>Amount</th><th>Score</th><th>Date</th></tr></thead>
               <tbody>${fraud.map((f) => `
                 <tr>
                   <td class="mono">${escapeHtml(f.cardNumber)}</td>
                   <td>${escapeHtml(f.month)}</td>
                   <td>${formatINR(f.totalAmount)}</td>
                   <td><span class="badge badge-danger">${Number(f.fraudScore).toFixed(2)}</span></td>
                   <td>${formatDate(f.distributedAt)}</td>
                 </tr>`).join('')}</tbody>
             </table></div>`
          : '<div class="empty-state"><div class="icon">&#9989;</div><p>No fraud flags</p></div>';
      } catch (err) {
        showAlert('alert', err.message, 'danger');
      }
    }

    load();
  </script>
</body>
</html>
