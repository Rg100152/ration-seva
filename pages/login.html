<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Raj Gautam">
  <title>Login - Ration Seva</title>
  <link rel="icon" href="../images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body>
  <div class="tricolor-top"></div>
  <div class="auth-bg">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="icon">&#127806;</div>
        <h1>Ration Seva</h1>
        <p>by <strong style="color:var(--accent)">Raj Gautam</strong></p>
      </div>

      <div id="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="aadhaar">Aadhaar Number</label>
          <input type="text" id="aadhaar" class="form-input" inputmode="numeric" maxlength="12" placeholder="12-digit Aadhaar" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Login</button>
      </form>

      <p class="auth-footer">No account? <a href="register.html">Register</a></p>
      <p class="auth-footer" style="margin-top:10px"><a href="../index.html" style="color:var(--muted)">&larr; Back to Home</a></p>

      <div class="demo-box">
        <strong>Demo accounts</strong><br>
        Beneficiary: 111111111111 / demo1234<br>
        Shopkeeper: 222222222222 / demo1234<br>
        Admin: 333333333333 / admin1234
      </div>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
