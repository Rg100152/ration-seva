<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Raj Gautam">
  <title>Settings - Ration Seva</title>
  <link rel="icon" href="../images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/shared.css">
</head>
<body>
  <div class="tricolor-top"></div>
  <div id="navbar"></div>

  <main class="container-narrow">
    <div class="breadcrumb"><a href="dashboard.html">Dashboard</a><span>&rsaquo;</span><span>Settings</span></div>
    <div class="page-header">
      <h1>Settings</h1>
      <p>Application and connection preferences.</p>
    </div>

    <div id="alert"></div>

    <div class="card">
      <h3 class="card-title">API Connection</h3>
      <div class="form-group">
        <label class="form-label" for="apiBase">API Base URL</label>
        <input type="text" id="apiBase" class="form-input" placeholder="https://api.example.com/api">
        <p class="form-hint">Change this if the backend runs on a different host or port.</p>
      </div>
      <div class="flex flex-wrap gap-12">
        <button class="btn btn-primary" id="saveApi">Save API URL</button>
        <button class="btn btn-outline" id="testApi">Test Connection</button>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">Session</h3>
      <p class="text-muted text-sm" style="margin-bottom:14px">
        Clear locally stored session data on this device.
      </p>
      <div class="flex flex-wrap gap-12">
        <button class="btn btn-danger" id="clearSession">Logout &amp; Clear Session</button>
        <button class="btn btn-outline" id="resetAll">Reset All Local Data</button>
      </div>
    </div>

    <div class="card">
      <h3 class="card-title">About</h3>
      <p class="text-muted text-sm" style="line-height:1.8">
        Ration Seva v1.0<br>
        Developed by <strong>Raj Gautam</strong><br>
        API base: <span class="mono" id="currentApi"></span>
      </p>
    </div>
  </main>

  <div id="footer"></div>
  <script src="../js/config.js"></script>
  <script src="../js/mock-api.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/nav.js"></script>
  <script>
    requireAuth();
    const input = document.getElementById('apiBase');
    input.value = API_BASE;
    document.getElementById('currentApi').textContent = API_BASE;

    document.getElementById('saveApi').addEventListener('click', () => {
      const value = input.value.trim().replace(/\/$/, '');
      if (!/^https?:\/\//.test(value)) {
        return showAlert('alert', 'API URL must start with http:// or https://', 'danger');
      }
      localStorage.setItem('ration_api_base', value);
      showAlert('alert', 'API URL saved. Reloading...', 'success');
      setTimeout(() => window.location.reload(), 900);
    });

    document.getElementById('testApi').addEventListener('click', async () => {
      const value = input.value.trim().replace(/\/$/, '');
      try {
        const res = await fetch(value.replace(/\/api$/, '') + '/health');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        showAlert('alert', 'Connected to ' + (data.service || 'server') + ' successfully.', 'success');
      } catch (err) {
        showAlert('alert', 'Connection failed: ' + err.message, 'danger');
      }
    });

    document.getElementById('clearSession').addEventListener('click', logout);

    document.getElementById('resetAll').addEventListener('click', () => {
      localStorage.clear();
      window.location.href = '../index.html';
    });
  </script>
</body>
</html>
